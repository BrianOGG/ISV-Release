# Manual, source-protected native-module build. No standalone Nuitka binaries,
# private Python/C/object cache, or automatic compile triggers.
name: KOL Selection release (public builder)
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional stable SemVer; blank = next independent dev version'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: isv-kol-selection-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      source_tree: ${{ steps.resolve.outputs.source_tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: main
          sparse-checkout: kol-selection
          path: source
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Test public version and source-fingerprint contracts
        shell: bash
        run: |
          python3 -m unittest discover -s builder/scripts -p test_resolve_version.py -v
          python3 -m unittest discover -s builder/scripts -p test_source_input_fingerprint.py -v
      - name: Resolve source-only release fingerprint
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C source rev-parse HEAD)"
          tree="$(python3 builder/scripts/source_input_fingerprint.py --project kol-selection --repo source)"
          python3 builder/scripts/resolve_version.py --project kol-selection \
            --source-tree "$tree" --source-sha "$sha" --manual-version "$MANUAL_VERSION"

  preflight:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: ${{ needs.prepare.outputs.source_sha }}
          sparse-checkout: kol-selection
          path: source
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: source/kol-selection/config/requirements-build.txt
      - name: Require native-module source contract (fail fast)
        working-directory: source/kol-selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, '../../builder/scripts')
          from module_archive import check_lock
          script = Path('scripts/build_runtime.py')
          lock = Path('config/requirements-runtime.txt')
          if not script.is_file() or not lock.is_file():
              raise SystemExit('MODULE_BUILD_OR_RUNTIME_LOCK_MISSING')
          if '--mode=standalone' in script.read_text(encoding='utf-8'):
              raise SystemExit('LEGACY_STANDALONE_BUILDER_NOT_ALLOWED')
          try:
              check_lock(lock.read_bytes())
          except ValueError as exc:
              raise SystemExit('RUNTIME_LOCK_INVALID:' + str(exc)) from None
          print('Native-module source contract passed')
          PY
      - name: Offline private-source regression tests
        working-directory: source/kol-selection
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r config/requirements-build.txt
          python -m compileall -q backend
          python -m unittest discover -s tests -p test_kol_names.py -v
          python -m unittest discover -s tests -p test_runtime_control.py -v

  build:
    needs: [prepare, preflight]
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, runner: macos-14 }
          - { platform: windows-x64, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: source/kol-selection
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: ${{ needs.prepare.outputs.source_sha }}
          sparse-checkout: kol-selection
          path: source
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: source/kol-selection/config/requirements-build.txt
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: source/kol-selection/config/pnpm-lock.yaml
      - name: Install pinned build-time tools
        run: python -m pip install -r config/requirements-build.txt
      - name: Compile EC-AI private modules only (no third-party compilation)
        env:
          COMPILED_VERSION: ${{ needs.prepare.outputs.version }}
          NUITKA_DISABLE_CACHE: '1'
        run: |
          set -euo pipefail
          started="$(date +%s)"
          result=0
          python scripts/build_runtime.py \
            --platform '${{ matrix.platform }}' \
            --version '${{ needs.prepare.outputs.version }}' \
            --output-dir "$RUNNER_TEMP/module-output" || result=$?
          elapsed=$(( $(date +%s) - started ))
          if [ "$result" -eq 0 ]; then state=passed; else state=failed; fi
          printf '| KOL Selection | %s | %ss | %s | native modules only |\n' \
            '${{ matrix.platform }}' "$elapsed" "$state" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Validate output and make public-safe native archive
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/builder/scripts/package_module_artifact.py" \
            --root "$RUNNER_TEMP/module-output" \
            --project kol-selection --platform '${{ matrix.platform }}' \
            --version '${{ needs.prepare.outputs.version }}' \
            --output "$RUNNER_TEMP/module-runtime.zip"
      - name: Upload only pre-validated compiled-module archive
        uses: actions/upload-artifact@v4
        with:
          name: kol-selection-native-${{ matrix.platform }}
          path: ${{ runner.temp }}/module-runtime.zip
          if-no-files-found: error
          retention-days: 3

  test-runtime:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, runner: macos-14 }
          - { platform: windows-x64, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4
        with:
          name: kol-selection-native-${{ matrix.platform }}
          path: native
      - name: Install hash-locked public wheels and test private compiled modules
        shell: bash
        run: |
          set -euo pipefail
          python builder/scripts/smoke_module_runtime.py \
            --archive native/module-runtime.zip --project kol-selection \
            --platform '${{ matrix.platform }}' --version '${{ needs.prepare.outputs.version }}'

  assemble:
    needs: [prepare, preflight, build, test-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: ${{ needs.prepare.outputs.source_sha }}
          sparse-checkout: kol-selection/skills/kol-selection
          path: source
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: kol-selection-native-macos-arm64
          path: native/mac
      - uses: actions/download-artifact@v4
        with:
          name: kol-selection-native-windows-x64
          path: native/win
      - name: Assemble immutable Runtime archives and <20 MB Skill
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/assemble_modules.py \
            --project kol-selection --version '${{ needs.prepare.outputs.version }}' \
            --tag '${{ needs.prepare.outputs.tag }}' \
            --source source --mac native/mac/module-runtime.zip \
            --win native/win/module-runtime.zip \
            --templates builder/scripts --output dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: kol-selection-module-release-bundle
          path: dist/release/*
          if-no-files-found: error
          retention-days: 3

  verify-final-skill:
    needs: [prepare, assemble]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4
        with:
          name: kol-selection-module-release-bundle
          path: release-bundle
      - name: PowerShell 5.1 install/start/status/stop of actual Skill
        shell: pwsh
        run: |
          $v = '${{ needs.prepare.outputs.version }}'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File builder/scripts/test_module_skill_install.ps1 \
            -Project 'kol-selection' \
            -SkillZip "release-bundle/kol-selection-skill-$v.zip" \
            -RuntimeZip "release-bundle/kol-selection-runtime-windows-x64-$v.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Native-module final Skill failed Windows 5.1 smoke' }

  publish:
    needs: [prepare, assemble, verify-final-skill]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kol-selection-module-release-bundle
          path: dist/release
      - name: Publish immutable source-protected native-module release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.prepare.outputs.source_tree }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Immutable release already exists"
            exit 1
          fi
          notes="$(printf 'KOL Selection %s\n\nSource-Commit: %s\nSource-Tree: %s\n\nNative CPython 3.12 private modules only (.so / .pyd); public third-party packages are installed into an isolated venv by the Skill. SHA256-verified downloads, no private Python source or C intermediates in release.\n' \
            "$VERSION" "$SOURCE_SHA" "$SOURCE_TREE")"
          options=()
          if [ "$PRERELEASE" = true ]; then options+=(--prerelease); fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --target main --title "KOL Selection $VERSION" \
            "\${options[@]}" --notes "$notes" dist/release/*
