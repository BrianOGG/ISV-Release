# Codex v2 native-Core contract. Build requested for EC-AI native-module handoff. Only E2E and KOL use this pipeline.
# No third-party Python compilation and no private source/C/object uploads.
name: KOL Selection release (public builder)
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional stable version; blank = next dev'
        type: string
        required: false
  push:
    branches: [main]
    paths: ['.github/workflows/kol-selection.yml']

permissions:
  contents: read
concurrency:
  group: isv-kol-selection-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[module-build]')
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      source_tree: ${{ steps.resolve.outputs.source_tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: main
          sparse-checkout: kol-selection
          path: source
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Verify public release versioning and assembly contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s builder/scripts -p test_resolve_version.py -v
          python3 -m unittest discover -s builder/scripts -p test_source_input_fingerprint.py -v
          python3 -m unittest discover -s builder/scripts -p test_handoff_core.py -v
      - name: Resolve immutable source SHA and project build fingerprint
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          sha="$(git -C source rev-parse HEAD)"
          tree="$(python3 builder/scripts/source_input_fingerprint.py --project kol-selection --repo source)"
          python3 builder/scripts/resolve_version.py --project kol-selection \
            --source-tree "$tree" --source-sha "$sha" --manual-version "$MANUAL_VERSION"

  preflight:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: ${{ needs.prepare.outputs.source_sha }}
          sparse-checkout: kol-selection
          path: source
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: source/kol-selection/config/requirements-build.txt
      - name: Validate native Core source contract before slow compile
        working-directory: source/kol-selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("scripts/build_runtime.py")
          t=p.read_text(encoding="utf-8")
          assert "--mode=standalone" not in t, "Legacy standalone builder blocked"
          assert "--reuse-core" in t, "Native Core v2 input contract missing"
          assert Path("scripts/verify_native_core.py").is_file(), "Native import POC missing"
          assert Path("config/requirements-runtime-macos-arm64.txt").is_file()
          assert Path("config/requirements-runtime-windows-x64.txt").is_file()
          assert Path("skills/kol-selection/scripts/ecai_install.py").is_file()
          assert Path("skills/kol-selection/scripts/ecai_launcher.py").is_file()
          print("Private-source v2 packaging contract passed")
          PY
      - name: Prepare cross-platform fixture temp root
        shell: bash
        run: sudo install -d -m 1777 /private/tmp
      - name: Run relevant source-side offline regressions
        working-directory: source/kol-selection
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r config/requirements-build.txt > "$RUNNER_TEMP/private-pip.log" 2>&1
          python -m unittest discover -s tests -p test_build_runtime_options.py -v
          python -m unittest discover -s tests -p test_runtime_control.py -v

  build:
    needs: [prepare, preflight]
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, runner: macos-14 }
          - { platform: windows-x64, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: source/kol-selection
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: ${{ needs.prepare.outputs.source_sha }}
          sparse-checkout: kol-selection
          path: source
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: source/kol-selection/config/requirements-build.txt
      - name: Install build dependencies from immutable source version
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r config/requirements-build.txt > "$RUNNER_TEMP/private-pip.log" 2>&1
      - name: Compile PRIVATE native modules only
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          result=0
          python scripts/build_runtime.py \
            --platform '${{ matrix.platform }}' \
            --version '${{ needs.prepare.outputs.version }}' \
            --output-dir "$RUNNER_TEMP/native-core-build" \
            > "$RUNNER_TEMP/native-compiler-private.log" 2>&1 || result=$?
          elapsed=$(( $(date +%s) - started ))
          if [ "$result" -ne 0 ]; then echo "::error::Native Core compile failed; raw logs withheld because private-source details may appear"; fi
          if [ "$result" -eq 0 ]; then state=passed; else state=failed; fi
          printf '| KOL Selection | %s | %ss | %s |\n' '${{ matrix.platform }}' "$elapsed" "$state" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Validate final Core bytes and package without source/debug files
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/builder/scripts/core_handoff_archive.py" \
            --directory "$RUNNER_TEMP/native-core-build/kol-selection-core-${{ matrix.platform }}" \
            --output "$RUNNER_TEMP/native-core.zip" \
            --project kol-selection --platform '${{ matrix.platform }}' \
            --version '${{ needs.prepare.outputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: kol-selection-core-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-core.zip
          if-no-files-found: error
          retention-days: 3

  assemble:
    needs: [prepare, preflight, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: ${{ needs.prepare.outputs.source_sha }}
          sparse-checkout: kol-selection/skills/kol-selection
          path: source
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: kol-selection-core-macos-arm64
          path: native/mac
      - uses: actions/download-artifact@v4
        with:
          name: kol-selection-core-windows-x64
          path: native/win
      - name: Assemble audited ECAI bootstrap and immutable Core ZIPs
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/assemble_handoff.py \
            --project kol-selection --version '${{ needs.prepare.outputs.version }}' \
            --tag '${{ needs.prepare.outputs.tag }}' \
            --source source --mac native/mac/native-core.zip \
            --win native/win/native-core.zip --output dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: kol-selection-handoff-bundle
          path: dist/release/*
          if-no-files-found: error
          retention-days: 3

  verify:
    needs: [prepare, assemble]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, runner: macos-14 }
          - { platform: windows-x64, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: ${{ needs.prepare.outputs.source_sha }}
          sparse-checkout: kol-selection
          path: source
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4
        with:
          name: kol-selection-handoff-bundle
          path: artifacts
      - name: Real native imports, PowerShell/sh Skill, 23-KOL demo or E2E API
        shell: bash
        run: |
          set -euo pipefail
          python builder/scripts/smoke_handoff.py \
            --project kol-selection \
            --source source/kol-selection \
            --skill "artifacts/kol-selection-skill-${{ needs.prepare.outputs.version }}.zip" \
            --core "artifacts/kol-selection-core-${{ matrix.platform }}-${{ needs.prepare.outputs.version }}.zip"

  publish:
    needs: [prepare, assemble, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kol-selection-handoff-bundle
          path: dist/release
      - name: Publish only after both platforms verify final installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.prepare.outputs.source_tree }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refuse replacing immutable existing release"
            exit 1
          fi
          notes="$(printf 'KOL Selection %s\n\nSource-Commit: %s\nSource-Tree: %s\n\nNuitka native Core CPython 3.12, independently hash-locked third-party dependencies installed by included ECAI Skill. No private source in public release. Native import and installed runtime lifecycle tested on Windows and macOS.\n' "$VERSION" "$SOURCE_SHA" "$SOURCE_TREE")"
          options=()
          if [ "$PRERELEASE" = "true" ]; then options+=(--prerelease); fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --target main --title "KOL Selection $VERSION" \
            "\${options[@]}" --notes "$notes" dist/release/*
