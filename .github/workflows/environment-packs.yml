# Independent public environment layer for compiled KOL + E2E Core. Initial environment bundle run.
# Produces CPython 3.12.10 and platform-specific, offline-verifiable wheels.
# Does NOT compile private business code, modify existing releases, or deploy a Skill.
name: Build common CPython and offline dependencies
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/environment-packs.yml

permissions:
  contents: read

concurrency:
  group: ecai-public-environment-cp312
  cancel-in-progress: false

env:
  ENV_VERSION: '2026.10.23.1'
  SOURCE_COMMIT: '175539044e02735b353af1b78143018507316d5a'

jobs:
  environment:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-env]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
          - platform: windows-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout public Release builders
        uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - name: Checkout ONLY immutable third-party lock files
        uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: ${{ env.SOURCE_COMMIT }}
          sparse-checkout: |
            kol-selection/config
            kol-selection/skills/kol-selection/assets
            e2e/config
            e2e/skills/e2e/assets
          path: locks
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Set up host Python for downloading public wheels
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Set up managed Python downloader
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: 'latest'
          enable-cache: false
      - name: Acquire portable CPython 3.12.10 into isolated installation tree
        shell: bash
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/ecai-managed-python
        run: |
          set -euo pipefail
          uv python install 3.12.10
          test -d "$UV_PYTHON_INSTALL_DIR"
      - name: Build offline wheelhouse and test REAL relocated CPython + both clean project environments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/environment-output"
          python builder/scripts/build_environment_pack.py \
            --source locks \
            --python-dir "$RUNNER_TEMP/ecai-managed-python" \
            --platform '${{ matrix.platform }}' \
            --version "$ENV_VERSION" \
            --output "$RUNNER_TEMP/environment-output/ecai-environment-cp312-${{ matrix.platform }}-$ENV_VERSION.tar.gz"
      - name: Re-extract archive, verify all file hashes and relocated interpreter
        shell: bash
        run: |
          set -euo pipefail
          python builder/scripts/verify_environment_pack.py \
            --archive "$RUNNER_TEMP/environment-output/ecai-environment-cp312-${{ matrix.platform }}-$ENV_VERSION.tar.gz" \
            --platform '${{ matrix.platform }}' \
            --version "$ENV_VERSION" --execute-python
      - name: Upload ONLY public Environment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecai-public-environment-${{ matrix.platform }}
          path: ${{ runner.temp }}/environment-output/*.tar.gz
          if-no-files-found: error
          retention-days: 5

  publish:
    needs: environment
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ecai-public-environment-macos-arm64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ecai-public-environment-windows-x64
          path: dist
      - name: Verify both environments before publishing
        shell: bash
        run: |
          set -euo pipefail
          for platform in macos-arm64 windows-x64; do
            python3 scripts/verify_environment_pack.py \
              --archive "dist/ecai-environment-cp312-$platform-$ENV_VERSION.tar.gz" \
              --platform "$platform" --version "$ENV_VERSION"
          done
          cd dist
          sha256sum ecai-environment-cp312-* > SHA256SUMS.txt
      - name: Publish independent, immutable Environment Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="environment-cp312-$ENV_VERSION"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Environment release already exists; will not overwrite."
            exit 1
          fi
          notes="$(cat <<EOF
          Public environment candidate for EC-AI KOL Selection and E2E.

          CPython 3.12.10 (Astral python-build-standalone via uv), macOS ARM64 and Windows x64.
          Includes public pinned bootstrap + runtime wheels for BOTH applications, with
          separate project locks. All dependencies downloaded with original PyPI hashes.
          E2E undetected-chromedriver 3.5.5 is built once into a wheel by CI from
          its SHA256-pinned PyPI sdist; resulting offline wheel hash is in the bundled
          effective lock. Source locks are retained for provenance.

          CI validated that both project environments can be freshly built OFFLINE,
          and that relocated CPython 3.12.10 is executable and can import ssl/sqlite3.
          SHA256SUMS.txt covers each platform's archive.

          This is NOT a fully installed portable venv. Each project creates an isolated
          venv using the included interpreter and installs its verified wheels from the
          same local tarball. No Nuitka business modules and no EC-AI private code are
          included. Existing KOL/E2E Skill ZIPs are UNCHANGED and do not yet consume
          these environment packs.

          Source dependency lock commit: $SOURCE_COMMIT
          Python distribution: https://github.com/astral-sh/python-build-standalone
          EOF
          )"
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target main \
            --title "EC-AI common Python 3.12 environment $ENV_VERSION" \
            --prerelease --notes "$notes" dist/*
          echo "### Published public environment $tag" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
