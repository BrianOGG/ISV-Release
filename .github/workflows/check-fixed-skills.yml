name: Verify fixed Skills route to matching platform runtimes
on:
  push:
    branches: [codex/fixed-skill-platform-routing]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        project: [kol-selection, e2e]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify real fixed Skill platform selection, download and lifecycle
        shell: powershell
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          $ErrorActionPreference='Stop'
          $Project=$env:PROJECT
          $Skill=Join-Path $env:RUNNER_TEMP "fixed-skill-$Project"
          Expand-Archive -LiteralPath "dist/fixed-skills/v1.0.1/$Project-skill-1.0.1.zip" -DestinationPath $Skill
          $Install=Join-Path $env:RUNNER_TEMP "设备检查 with spaces/$Project"
          $env:KOL_DATA_DIR=Join-Path $env:RUNNER_TEMP 'fixed-kol-data'
          $env:E2E_DATA_DIR=Join-Path $env:RUNNER_TEMP 'fixed-e2e-data'
          $Port=if ($Project -eq 'e2e') {18787} else {18788}
          function Call-Skill([string]$Action) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $Skill 'scripts/setup.ps1') -Action $Action -InstallDir $Install -Port $Port
            if ($LASTEXITCODE -ne 0) { throw "FIXED_SKILL_${Action}_FAILED" }
            Write-Output "FIXED_SKILL_${Action}_PASSED"
          }
          Call-Skill 'prepare'
          Call-Skill 'install'
          Call-Skill 'install'
          Call-Skill 'version'
          Call-Skill 'doctor'
          try {
            Call-Skill 'start'
            Call-Skill 'status'
            $Response=Invoke-WebRequest -Uri "http://127.0.0.1:$Port/" -UseBasicParsing
            if ($Response.StatusCode -ne 200) { throw 'FIXED_SKILL_HTTP_FAILED' }
          } finally { Call-Skill 'stop' }
          Write-Output 'FIXED_SKILL_WINDOWS_X64_DOWNLOAD_AND_RUN_PASSED'
  macos-routing:
    runs-on: macos-14
    strategy:
      matrix:
        project: [kol-selection, e2e]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify ARM64 detection, live Release resolution and browser metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          unzip -q "dist/fixed-skills/v1.0.1/$PROJECT-skill-1.0.1.zip" -d skill
          sh skill/scripts/setup.sh prepare
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          osascript -l JavaScript skill/scripts/resolve-macos.js releases "$RUNNER_TEMP/releases.json" "$PROJECT" > "$RUNNER_TEMP/resolved.txt"
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          project=os.environ['PROJECT'];root=Path(os.environ['RUNNER_TEMP'])
          lines=(root/'resolved.txt').read_text().splitlines()
          assert len(lines)==3 and re.fullmatch('[0-9a-f]{64}',lines[2])
          assert '/'+project+'-portable-mac-' in lines[1]
          assert project+'-portable-macos-arm64-' in lines[1]
          browser='browsers' if project=='kol-selection' else 'browser/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing'
          (root/'metadata.json').write_text(json.dumps({'project':project,'platform':'macos-arm64','version':lines[0],'packages_preinstalled':True,'python_executable':'python/runtime/bin/python3.12','browser_path':browser}))
          PY
          osascript -l JavaScript skill/scripts/resolve-macos.js metadata "$RUNNER_TEMP/metadata.json" "$PROJECT" > "$RUNNER_TEMP/metadata-result.txt"
          test "$(wc -l < "$RUNNER_TEMP/metadata-result.txt" | tr -d ' ')" = 3
          echo FIXED_SKILL_MACOS_ARM64_ROUTING_PASSED
