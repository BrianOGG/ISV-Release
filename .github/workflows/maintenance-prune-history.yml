name: One-time repository housekeeping
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/maintenance-prune-history.yml
permissions:
  contents: write
  actions: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete unchanged obsolete branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remove_branch() {
            local branch="$1" expected="$2" actual
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [[ -z "$actual" ]]; then echo "ALREADY_REMOVED $branch"; return; fi
            if [[ "$actual" != "$expected" ]]; then echo "::error::Branch moved: $branch"; exit 1; fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
            echo "REMOVED_BRANCH $branch"
          }
          remove_branch 'codex/fixed-skill-platform-routing' '330ddf17853f0d4cd36d1141635b4db89745f238'
          remove_branch 'codex/publish-windows-preview' '905988dc5b0c4d1496bd32feaa6dcc1ee80dcb0a'
          remove_branch 'codex/windows-start-diagnostics' '049e47ec984fd71c682d5fe55b19e18687c24f92'
          remove_branch 'fix/windows-ready-check-rebuild' '77e14bdf2d7fea54616c0727b65ae400d846388f'
      - name: Delete failed Actions runs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids_file="$(mktemp)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.conclusion == "failure") | .id' > "$ids_file"
          count=0
          while IFS= read -r id; do
            [[ "$id" =~ ^[0-9]+$ ]] || { echo '::error::Invalid run ID'; exit 1; }
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null
            count=$((count + 1))
          done < "$ids_file"
          rm -f "$ids_file"
          echo "DELETED_FAILED_RUNS=$count"
          echo "### Housekeeping: $count failed workflow runs deleted; successful runs and releases preserved" >> "$GITHUB_STEP_SUMMARY"
