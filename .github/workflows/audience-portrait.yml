name: Audience Portrait release (public builder)
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional stable release, e.g. 1.0.0 or 1.1.0; blank = next automatic dev'
        type: string
        required: false
  schedule:
    - cron: '47 */2 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/audience-portrait.yml']
permissions:
  contents: write
concurrency:
  group: isv-audience-portrait-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      source_sha: ${{ steps.check.outputs.source_sha }}
      source_tree: ${{ steps.check.outputs.source_tree }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: main
          sparse-checkout: audience-portrait
          path: source
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Test version resolver
        run: python3 -m unittest discover -s builder/scripts -p 'test_resolve_version.py'
      - name: Resolve independent automatic dev or manual stable version
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          sha="$(git -C source rev-parse HEAD)"
          tree="$(git -C source rev-parse HEAD:audience-portrait)"
          python3 builder/scripts/resolve_version.py \
            --project audience-portrait --source-tree "$tree" --source-sha "$sha" \
            --manual-version "$MANUAL_VERSION"

  preflight:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/audience-portrait/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: source/audience-portrait/config/requirements-build.txt
      - name: Build and typecheck frontend once (reused on both platforms)
        working-directory: source/audience-portrait/frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: portrait-frontend
          path: source/audience-portrait/frontend/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Portability check, bytecode compilation and private diagnostic tests
        working-directory: source/audience-portrait
        run: |
          python -m compileall -q backend
          python scripts/check_unix_only_apis.py --self-test
          python scripts/check_unix_only_apis.py --root backend
          python -m pip install -r config/requirements-build.txt
          python -m unittest discover -s tests -p 'test_diagnostics.py' -v

  build-macos:
    needs: [prepare, preflight]
    if: needs.prepare.outputs.build == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Configure paths
        shell: bash
        run: |
          echo "PORTRAIT_BUILD_ROOT=$RUNNER_TEMP/audience-portrait/build/macos-arm64" >> "$GITHUB_ENV"
          echo "PORTRAIT_RELEASE_ROOT=$RUNNER_TEMP/audience-portrait/release/macos-arm64" >> "$GITHUB_ENV"
          echo "PORTRAIT_BUILD_VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: source/audience-portrait/config/requirements-build.txt
      - uses: actions/download-artifact@v4
        with:
          name: portrait-frontend
          path: source/audience-portrait/frontend/dist/
      - name: Install pinned build dependencies
        working-directory: source/audience-portrait
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r config/requirements-build.txt
      - name: Validate portability and compile
        working-directory: source/audience-portrait
        run: |
          .venv/bin/python scripts/check_unix_only_apis.py --self-test
          .venv/bin/python scripts/check_unix_only_apis.py --root backend
          bash scripts/build_macos_arm64.sh
      - uses: actions/upload-artifact@v4
        with:
          name: portrait-macos
          path: ${{ runner.temp }}/audience-portrait/release/macos-arm64/*.zip
          if-no-files-found: error
          retention-days: 7

  build-windows:
    needs: [prepare, preflight]
    if: needs.prepare.outputs.build == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Configure paths
        shell: pwsh
        run: |
          "PORTRAIT_BUILD_ROOT=$env:RUNNER_TEMP\audience-portrait\build\windows-x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PORTRAIT_RELEASE_ROOT=$env:RUNNER_TEMP\audience-portrait\release\windows-x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PORTRAIT_BUILD_VERSION=${{ needs.prepare.outputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: source/audience-portrait/config/requirements-build.txt
      - uses: actions/download-artifact@v4
        with:
          name: portrait-frontend
          path: source/audience-portrait/frontend/dist/
      - name: Install pinned build dependencies
        working-directory: source/audience-portrait
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r config\requirements-build.txt
      - name: Validate portability
        working-directory: source/audience-portrait
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe scripts\check_unix_only_apis.py --self-test
          .\.venv\Scripts\python.exe scripts\check_unix_only_apis.py --root backend
      - name: Build with clang
        id: clang
        continue-on-error: true
        working-directory: source/audience-portrait
        shell: pwsh
        env:
          PORTRAIT_C_COMPILER: clang
        run: .\scripts\build_windows_x64.ps1
      - name: Fall back to MSVC
        if: steps.clang.outcome == 'failure'
        working-directory: source/audience-portrait
        shell: pwsh
        env:
          PORTRAIT_C_COMPILER: msvc
          PORTRAIT_ALLOW_OVERWRITE: '1'
        run: .\scripts\build_windows_x64.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: portrait-windows
          path: ${{ runner.temp }}/audience-portrait/release/windows-x64/*.zip
          if-no-files-found: error
          retention-days: 7

  test-macos:
    needs: [prepare, build-macos]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: portrait-macos
          path: runtime-zip
      - name: Smoke test extracted compiled runtime without Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find runtime-zip -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$archive"
          mkdir -p "$RUNNER_TEMP/portrait-unpack"
          ditto -x -k "$archive" "$RUNNER_TEMP/portrait-unpack"
          exe="$(find "$RUNNER_TEMP/portrait-unpack" -type f -name audience-portrait -print -quit)"
          test -n "$exe" && test -x "$exe"
          export PORTRAIT_STORAGE=memory PORTRAIT_PORT=8766
          export PORTRAIT_DATA_DIR="$RUNNER_TEMP/portrait-smoke-data"
          "$exe" > "$RUNNER_TEMP/portrait-smoke.log" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          python3 builder/scripts/smoke_portrait_service.py --base-url http://127.0.0.1:8766 || {
            tail -n 40 "$RUNNER_TEMP/portrait-smoke.log"; exit 1; }

  test-windows:
    needs: [prepare, build-windows]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: portrait-windows
          path: runtime-zip
      - name: Smoke test extracted compiled runtime without Python dependencies
        shell: pwsh
        run: |
          $archive = Get-ChildItem 'runtime-zip' -Filter '*.zip' | Select-Object -First 1
          if (-not $archive) { throw 'compiled runtime archive is missing' }
          $dir = Join-Path $env:RUNNER_TEMP 'portrait-unpack'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $dir
          $exe = Get-ChildItem -LiteralPath $dir -Filter audience-portrait.exe -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'compiled runtime executable is missing' }
          $env:PORTRAIT_DATA_DIR = Join-Path $env:RUNNER_TEMP 'portrait-smoke-data'
          $env:PORTRAIT_STORAGE = 'memory'
          $env:PORTRAIT_PORT = '18999'
          $proc = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru -WindowStyle Hidden
          try {
            python builder/scripts/smoke_portrait_service.py --base-url http://127.0.0.1:18999
            if ($LASTEXITCODE -ne 0) { throw 'compiled service smoke test failed' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

  publish:
    needs: [prepare, preflight, build-macos, build-windows, test-macos, test-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          sparse-checkout: |
            audience-portrait/skills/audience-portrait
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: portrait-macos
          path: portrait/mac
      - uses: actions/download-artifact@v4
        with:
          name: portrait-windows
          path: portrait/win
      - name: Assemble compiled runtime zips and portable Skill
        shell: bash
        run: |
          set -euo pipefail
          mac="$(find portrait/mac -maxdepth 1 -name '*.zip' -print -quit)"
          win="$(find portrait/win -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$mac" && test -n "$win"
          python3 builder/scripts/assemble_lite.py \
            --project audience-portrait \
            --version '${{ needs.prepare.outputs.version }}' \
            --tag '${{ needs.prepare.outputs.tag }}' \
            --source source --mac "$mac" --win "$win" \
            --templates builder/scripts --output dist/release
          test "$(stat -c %s "dist/release/audience-portrait-skill-${{ needs.prepare.outputs.version }}.zip")" -lt 20000000
          unzip -Z1 "dist/release/audience-portrait-skill-${{ needs.prepare.outputs.version }}.zip" | grep -Fx 'SKILL.md'
      - name: Publish immutable public Release (dev=prerelease)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.prepare.outputs.source_tree }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite immutable version $TAG"
            exit 1
          fi
          notes="$(printf 'Audience Portrait %s\n\nSource-Commit: %s\nSource-Tree: %s\n\nCompiled Nuitka runtimes (macOS ARM64 / Windows x64) plus a small Agent Skill ZIP (<20 MB). This Skill downloads SHA256-verified runtime on first use; no source is published.\n' "$VERSION" "$SOURCE_SHA" "$SOURCE_TREE")"
          options=()
          if [ "$PRERELEASE" = 'true' ]; then options+=(--prerelease); fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --target main --title "Audience Portrait $VERSION" \
            "${options[@]}" --notes "$notes" dist/release/*
