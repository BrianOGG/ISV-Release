name: Refresh latest Skill downloads

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update_release_catalog.py
      - scripts/test_release_catalog.py
      - .github/workflows/release-catalog.yml
  workflow_run:
    workflows:
      - Product Grabber release (public builder)
      - Audience Portrait release (public builder)
      - KOL Selection release (public builder)
      - E2E release (public builder)
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-skill-catalog
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release index
        run: python3 -m unittest discover -s scripts -p test_release_catalog.py -v

      - name: Mark historical Product Grabber release as legacy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="product-grabber-v0.5.0"
          endpoint="repos/$GITHUB_REPOSITORY/releases/tags/$tag"
          current="$(gh api "$endpoint")"
          id="$(jq -r .id <<< "$current")"
          prerelease="$(jq -r .prerelease <<< "$current")"
          name="$(jq -r .name <<< "$current")"
          if [[ "$prerelease" != "true" || "$name" != "Legacy · Product Grabber 0.5.0" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -f "name=Legacy · Product Grabber 0.5.0" \
              -F prerelease=true -f make_latest=false >/dev/null
          fi

      - name: Update README download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_release_catalog.py

      - name: Save updated index
        shell: bash
        run: |
          set -euo pipefail
          git add README.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "docs: update latest Skill version links"
            git push origin HEAD:main
          else
            echo 'README already matches latest releases.'
          fi
