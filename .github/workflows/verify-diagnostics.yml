name: Verify offline diagnostics (public scripts only)

on:
  push:
    paths:
      - scripts/export-diagnostics.sh
      - scripts/export-diagnostics.jxa
      - scripts/export-diagnostics.ps1
      - scripts/bootstrap.sh
      - scripts/bootstrap.ps1
      - scripts/assemble_lite.py
      - scripts/test_diagnostics_assembly.py
      - scripts/test_kol_skill_install.ps1
      - .github/workflows/verify-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify synthetic Skill packaging contracts
        run: python3 -m unittest discover -s scripts -p 'test_diagnostics_assembly.py' -v

  macos-export:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Verify shell and safe offline JSON export
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/bootstrap.sh scripts/export-diagnostics.sh
          root="$RUNNER_TEMP/diagnostics-test"
          mkdir -p "$root/scripts" "$root/assets"
          sed 's/@@PROJECT@@/audience-portrait/g' scripts/export-diagnostics.sh > "$root/scripts/export-diagnostics.sh"
          cp scripts/export-diagnostics.jxa "$root/scripts/export-diagnostics.jxa"
          printf '{"version":"1.0.0-dev.1"}\n' > "$root/assets/release.json"
          data="$HOME/Library/Application Support/AudiencePortrait/logs"
          boot="$HOME/Library/Application Support/ISV-Release/audience-portrait/logs"
          mkdir -p "$data" "$boot"
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$data/diagnostics.jsonl" "$timestamp" <<'PY'
          import json,sys
          record = {"schema_version":1,"time":sys.argv[2],"module":"web_app_memory",
                    "stage":"task.portrait","type":"RuntimeError","platform":"dmp",
                    "message":"cookie-SECRET-TEST",
                    "stack":'RuntimeError: original details omitted\n  File "web_app_memory.py", line 42, in worker'}
          with open(sys.argv[1],"w",encoding="utf-8") as f:
              f.write(json.dumps(record) + "\n")
          PY
          printf '{"schema_version":1,"time":"%s","module":"bootstrap","stage":"download","code":"runtime_download_failed"}\n' "$timestamp" > "$boot/bootstrap.jsonl"
          sh "$root/scripts/export-diagnostics.sh" --output "$root/report.json"
          python3 - "$root/report.json" <<'PY'
          import json,sys
          source=open(sys.argv[1],encoding='utf-8').read()
          data=json.loads(source)
          assert data['project']=='audience-portrait'
          assert data['version']=='1.0.0-dev.1'
          assert len(data['entries'])==2,data
          assert 'SECRET-TEST' not in source
          assert any(x['source']=='bootstrap' for x in data['entries'])
          assert any(x['source']=='runtime' and 'web_app_memory.py' in x['stack'] for x in data['entries'])
          PY
          # Bootstrap failure must also survive without a running runtime.
          sed -e 's/@@PROJECT@@/audience-portrait/g' -e 's/@@VERSION@@/1.0.0-dev.1/g' \
              -e 's#@@MAC_URL@@#https://127.0.0.1:1/missing.zip#g' \
              -e 's/@@MAC_SHA@@/00000000/g' scripts/bootstrap.sh > "$root/scripts/bootstrap-test.sh"
          if sh "$root/scripts/bootstrap-test.sh" status >/dev/null 2>&1; then
            echo "expected bootstrap failure" >&2; exit 1
          fi
          python3 - "$boot/bootstrap.jsonl" <<'PY'
          import json,sys
          rows=[json.loads(s) for s in open(sys.argv[1],encoding="utf-8")]
          assert rows[-1]["module"]=="bootstrap"
          assert rows[-1]["stage"] in ("platform","download"),rows[-1]
          assert rows[-1]["code"] in ("unsupported_platform","runtime_download_failed")
          PY

  windows-export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PowerShell 5.1 and safe offline JSON export
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = Join-Path $env:RUNNER_TEMP 'diagnostics-test'
          New-Item -ItemType Directory -Force -Path (Join-Path $Root 'scripts'), (Join-Path $Root 'assets') | Out-Null
          (Get-Content -LiteralPath scripts/export-diagnostics.ps1 -Raw).Replace('@@PROJECT@@','product-grabber') |
            Set-Content -LiteralPath (Join-Path $Root 'scripts/export-diagnostics.ps1') -Encoding UTF8
          '{"version":"1.0.0-dev.1"}' | Set-Content -LiteralPath (Join-Path $Root 'assets/release.json') -Encoding UTF8
          $Data = Join-Path ([Environment]::GetFolderPath('UserProfile')) '.product-grabber\data\logs'
          $Boot = Join-Path $env:LOCALAPPDATA 'ISV-Release\product-grabber\logs'
          New-Item -ItemType Directory -Force -Path $Data,$Boot | Out-Null
          $Now = [DateTimeOffset]::UtcNow.ToString('o')
          $Record = @{schema_version=1;time=$Now;module='server';stage='startup';type='Error';
            message='cookie-SECRET-TEST';stack='Error: original details omitted' + [char]10 + '    at server.mjs:42:1'}
          $Record | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $Data 'diagnostics.jsonl') -Encoding UTF8
          @{schema_version=1;time=$Now;module='bootstrap';stage='download';code='runtime_download_failed'} |
            ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $Boot 'bootstrap.jsonl') -Encoding UTF8
          $Out = Join-Path $Root 'report.json'
          & (Join-Path $Root 'scripts/export-diagnostics.ps1') -Output $Out
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'diagnostics exporter failed' }
          $Raw = Get-Content -LiteralPath $Out -Raw -Encoding UTF8
          $Report = $Raw | ConvertFrom-Json
          if ($Report.project -ne 'product-grabber' -or $Report.entries.Count -ne 2 -or
            $Raw.Contains('SECRET-TEST') -or $Report.version -ne '1.0.0-dev.1') {
            throw 'invalid exported report or sensitive data present'
          }
          # Deliberately fail download using loopback; raw error text must not be persisted.
          $BTemplate = Get-Content -LiteralPath scripts/bootstrap.ps1 -Raw
          $BTemplate = $BTemplate.Replace('@@PROJECT@@','product-grabber').Replace('@@VERSION@@','1.0.0-dev.1')
          $BTemplate = $BTemplate.Replace('@@WIN_URL@@','https://127.0.0.1:1/missing.zip').Replace('@@WIN_SHA@@','00000000')
          $BScript = Join-Path $Root 'scripts/bootstrap-test.ps1'
          [IO.File]::WriteAllText($BScript, $BTemplate, (New-Object Text.UTF8Encoding($false)))
          $Proc = Start-Process -FilePath 'powershell.exe' -ArgumentList @('-NoProfile','-File',$BScript) -PassThru -Wait
          if ($Proc.ExitCode -eq 0) { throw 'bootstrap unexpectedly passed' }
          $Log = Get-Content -LiteralPath (Join-Path $Boot 'bootstrap.jsonl') -Tail 1 -Encoding UTF8 | ConvertFrom-Json
          if ($Log.stage -ne 'download' -or $Log.code -ne 'runtime_download_failed') { throw 'failure was not journaled safely' }

  windows-kol-script:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse packaged Skill smoke script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $Content = Get-Content -LiteralPath scripts/test_kol_skill_install.ps1 -Raw -Encoding UTF8
          $Tokens = $null
          $Errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($Content, [ref]$Tokens, [ref]$Errors)
          if ($Errors.Count -ne 0) { throw 'Invalid Windows PowerShell 5.1 package smoke syntax' }
