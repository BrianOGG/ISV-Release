# Dev rebuild requested for product source commit cc753d1ae668 (2026-10-22)
name: Product Grabber release (public builder)
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional stable release, e.g. 1.0.0 or 1.1.0; blank = next automatic dev'
        required: false
        type: string
  schedule:
    - cron: '19 */2 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/product-grabber.yml']
permissions:
  contents: write
concurrency:
  group: isv-product-grabber-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      source_sha: ${{ steps.check.outputs.source_sha }}
      source_tree: ${{ steps.check.outputs.source_tree }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: main
          path: source
          sparse-checkout: product-scraping/product-grabber/package.json
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Test version resolver
        run: python3 -m unittest discover -s builder/scripts -p 'test_resolve_version.py'
      - name: Resolve independent automatic dev or manual stable version
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          sha="$(git -C source rev-parse HEAD)"
          tree="$(git -C source rev-parse HEAD:product-scraping/product-grabber)"
          python3 builder/scripts/resolve_version.py \
            --project product-grabber --source-tree "$tree" --source-sha "$sha" \
            --manual-version "$MANUAL_VERSION"

  preflight:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Fast private-source regression tests (no compile)
        working-directory: source/product-scraping/product-grabber
        run: |
          npm test
          node --test test/diagnostics.test.mjs test/native-registration.test.mjs

  build:
    needs: [prepare, preflight]
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, runner: macos-14, binary: product-grabber }
          - { platform: windows-x64, runner: windows-2022, binary: product-grabber.exe }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: source/product-scraping/product-grabber
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: source/product-scraping/product-grabber/pnpm-lock.yaml
      - name: Install pinned build dependencies
        run: pnpm install --frozen-lockfile
      - name: Stamp version in build workspace only (never change private repo)
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const version = process.env.RELEASE_VERSION;
            const m = /^(\d+)\.(\d+)\.(\d+)(?:-dev\.(\d+))?$/.exec(version);
            if (!m) throw Error("invalid release version");
            const [major, minor, patch] = m.slice(1,4).map(Number);
            const dev = m[4] === undefined ? 65535 : Number(m[4]);
            if ([major, minor, patch].some(n => n > 65535) || dev < 1 || dev > 65535)
              throw Error("Chrome extension version exceeds its numeric component limits");
            const pkgPath = "package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.version = version;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
            const manifestPath = "ext/manifest.json";
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            manifest.version = [major,minor,patch,dev].join(".");
            manifest.version_name = version;
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");
          '
      - name: Build source-protected Node SEA
        run: node build/build.mjs --platform '${{ matrix.platform }}' --out dist
      - name: Upload compiled payload only (never source)
        uses: actions/upload-artifact@v4
        with:
          name: product-runtime-${{ matrix.platform }}
          path: source/product-scraping/product-grabber/dist/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7

  test-runtime:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, runner: macos-14, binary: product-grabber }
          - { platform: windows-x64, runner: windows-2022, binary: product-grabber.exe }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: source/product-scraping/product-grabber
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/download-artifact@v4
        with:
          name: product-runtime-${{ matrix.platform }}
          path: source/product-scraping/product-grabber/dist/${{ matrix.platform }}
      - name: Stamp test workspace version (binary must match)
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e 'const fs=require("fs");const f="package.json";const p=JSON.parse(fs.readFileSync(f));p.version=process.env.RELEASE_VERSION;fs.writeFileSync(f,JSON.stringify(p))'
      - name: Install / native messaging / upgrade / rollback / uninstall smoke
        run: node test/package-smoke.mjs 'dist/${{ matrix.platform }}/${{ matrix.binary }}'

  publish:
    needs: [prepare, preflight, build, test-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BrianOGG/EC-AI
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          sparse-checkout: product-scraping/product-grabber/skills/product-grabber
          token: ${{ secrets.EC_AI_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: product-runtime-macos-arm64
          path: pg/mac
      - uses: actions/download-artifact@v4
        with:
          name: product-runtime-windows-x64
          path: pg/win
      - name: Assemble portable runtimes and small Skill
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/assemble_lite.py \
            --project product-grabber \
            --version '${{ needs.prepare.outputs.version }}' \
            --tag '${{ needs.prepare.outputs.tag }}' \
            --source source --mac pg/mac --win pg/win \
            --templates builder/scripts --output dist/release
          test "$(stat -c %s "dist/release/product-grabber-skill-${{ needs.prepare.outputs.version }}.zip")" -lt 20000000
          unzip -Z1 "dist/release/product-grabber-skill-${{ needs.prepare.outputs.version }}.zip" | grep -Fx 'SKILL.md'
      - name: Publish immutable public release (dev=prerelease)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.prepare.outputs.source_tree }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite immutable version $TAG"
            exit 1
          fi
          notes="$(printf 'Product Grabber %s\n\nSource-Commit: %s\nSource-Tree: %s\n\nCompiled runtime downloads for macOS ARM64 and Windows x64. Import the lightweight Skill ZIP (<20 MB) to download and verify the matching runtime automatically. Private source is not published.\n' "$VERSION" "$SOURCE_SHA" "$SOURCE_TREE")"
          options=()
          if [ "$PRERELEASE" = 'true' ]; then options+=(--prerelease); fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --target main --title "Product Grabber $VERSION" \
            "${options[@]}" --notes "$notes" dist/release/*
