name: One-time cleanup of failed portrait build artifacts
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-failed-portrait-artifacts-once.yml
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only artifacts from four verified failed portrait runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'BrianOGG/ISV-Release' ]] || exit 1
          removed=0
          bytes=0
          for run_id in 39964521698 40005799795 40028815410 40048436334; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion')"
            if [[ "$conclusion" != failure ]]; then
              echo "SKIP_RUN $run_id conclusion=$conclusion"
              continue
            fi
            while IFS=$'\t' read -r artifact_id artifact_bytes artifact_name; do
              [[ "$artifact_id" =~ ^[0-9]+$ ]] || continue
              [[ "$artifact_bytes" =~ ^[0-9]+$ ]] || exit 1
              case "$artifact_name" in portrait-macos|portrait-windows|portrait-frontend) ;; *) echo "SKIP_ARTIFACT $artifact_name"; continue;; esac
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > /dev/null
              removed=$((removed+1))
              bytes=$((bytes+artifact_bytes))
              echo "DELETED_ARTIFACT run=$run_id name=$artifact_name id=$artifact_id"
            done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" --jq '.artifacts[] | [.id,.size_in_bytes,.name] | @tsv')
          done
          echo "DELETED_ARTIFACT_COUNT=$removed"
          echo "DELETED_ARTIFACT_BYTES=$bytes"
          echo "### One-time cleanup: $removed failed portrait artifacts deleted ($bytes bytes). Releases unchanged." >> "$GITHUB_STEP_SUMMARY"
